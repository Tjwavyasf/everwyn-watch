name: Publish CLOCKED IN
on:
  push:
    branches: [main]
    paths:
      - 'warehouse-showdown/**'
      - 'clocked-in/**'
      - '.github/workflows/publish-clocked-in.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: clocked-in-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare game site
        run: |
          mkdir -p _site/clocked-in
          cp clocked-in/index.html _site/clocked-in/index.html
          cp clocked-in/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
