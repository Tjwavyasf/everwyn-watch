<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Warehouse Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one full-screen canvas. The arena is a pixel-art strip scaled to fit; HUD and touch buttons are drawn at full resolution on top. */
:root{
  --night:#07090e;      /* letterbox and page ground */
  --steel:#1b2433;      /* warehouse walls */
  --blade:#b45cff;      /* the player's charged box cutter */
  --alarm:#ff2650;      /* titles, health, danger */
  --vest:#ff8a1f;       /* safety orange */
  --ink:#e9eef7;        /* HUD text */
  --display:'Anton', Impact, 'Arial Narrow Bold', sans-serif;
  --hud:'Chakra Petch', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;}
body{color:var(--ink);font-family:var(--hud);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
#screen{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;}
#probe{position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);}
</style>
</head>
<body>
<canvas id="screen" tabindex="0" aria-label="Warehouse Showdown game. Keyboard: A and D to move, Space to jump, J slash, K heavy, L parry, Shift dash, U surge, P pause."></canvas>
<div id="probe"></div>
<script>
(() => {
'use strict';

/* ---------- setup ---------- */
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
const off = document.createElement('canvas');
const g = off.getContext('2d');
const probe = document.getElementById('probe');

const VH = 270, GROUND = 222, ARENA_W = 1400, GRAV = 980, TAU = Math.PI * 2;
const RUN = 150, JUMP = 390;
let VW = 480, W = 0, H = 0, DPR = 1;
let view = { x: 0, y: 0, w: 0, h: 0, s: 1 };
let inset = { t: 0, r: 0, b: 0, l: 0 };
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let showTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

const FONT_D = "Anton, Impact, 'Arial Narrow Bold', sans-serif";
const FONT_H = "'Chakra Petch', 'Trebuchet MS', system-ui, sans-serif";

const rand = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const sign = v => v < 0 ? -1 : 1;
const easeOut = t => 1 - (1 - t) * (1 - t);

function store(k, v) { try { localStorage.setItem('whs_' + k, JSON.stringify(v)); } catch (e) {} }
function load(k, d) { try { const v = localStorage.getItem('whs_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }

/* ---------- audio (all synthesized) ---------- */
let ac = null, master = null, noiseBuf = null, muted = !!load('muted', false);
function ensureAudio() {
  if (!ac) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try {
      ac = new C();
      master = ac.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; return; }
  }
  if (ac.state === 'suspended') ac.resume().catch(() => {});
}
function tone(f, dur, type, vol, f2, when) {
  const t = ac.currentTime + (when || 0);
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  gn.gain.setValueAtTime(vol, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, freq, type, q, when, f2) {
  const t = ac.currentTime + (when || 0);
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const fl = ac.createBiquadFilter(); fl.type = type || 'bandpass';
  fl.frequency.setValueAtTime(freq, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  fl.Q.value = q || 1;
  const gn = ac.createGain();
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(gn); gn.connect(master);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
}
const SFX = {
  swing: h => noise(h ? 0.2 : 0.1, h ? 0.24 : 0.14, h ? 1500 : 2600, 'bandpass', 0.8, 0, h ? 450 : 900),
  hit: h => { tone(h ? 110 : 170, 0.12, 'square', 0.15, 40); noise(0.09, h ? 0.4 : 0.26, h ? 900 : 1700, 'lowpass', 0.7); },
  parry: () => { tone(1650, 0.4, 'triangle', 0.2, 1500); tone(2480, 0.28, 'sine', 0.1); noise(0.05, 0.22, 5000, 'highpass'); },
  guard: () => tone(900, 0.05, 'triangle', 0.05),
  hurt: () => { tone(220, 0.22, 'sawtooth', 0.15, 70); noise(0.12, 0.22, 700, 'lowpass'); },
  shoot: () => { noise(0.1, 0.28, 3000, 'highpass'); tone(600, 0.08, 'square', 0.08, 150); },
  dash: () => noise(0.16, 0.12, 1800, 'bandpass', 0.6, 0, 400),
  jump: () => tone(300, 0.1, 'square', 0.05, 520),
  slam: () => { tone(80, 0.4, 'sine', 0.4, 30); noise(0.3, 0.3, 500, 'lowpass'); },
  ko: () => tone(90, 0.3, 'square', 0.14, 35),
  surge: () => { tone(200, 0.7, 'sawtooth', 0.14, 1200); noise(0.7, 0.25, 800, 'bandpass', 0.5, 0, 6000); },
  boom: () => { tone(60, 0.6, 'sine', 0.5, 25); noise(0.5, 0.35, 400, 'lowpass'); },
  aim: () => tone(1300, 0.05, 'square', 0.03),
  clear: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'square', 0.07, null, i * 0.09)),
  lose: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'square', 0.07, null, i * 0.14)),
  ui: () => tone(660, 0.06, 'square', 0.06),
};
function sfx(n, a) { if (ac && !muted) { try { SFX[n](a); } catch (e) {} } }

const BASS = [0, 0, 12, 0, 0, 0, 10, 12, 3, 3, 15, 3, 5, 5, 7, 10];
let mStep = 0, mNext = 0;
function music() {
  if (!ac || muted || mode !== 'play' || paused) { if (ac) mNext = 0; return; }
  const sp = 60 / (wave === WAVES.length - 1 ? 142 : 132) / 4;
  if (mNext < ac.currentTime) mNext = ac.currentTime + 0.03;
  while (mNext < ac.currentTime + 0.12) {
    const s = mStep % 32, t = mNext - ac.currentTime;
    try {
      if (s % 4 === 0) tone(130, 0.16, 'sine', 0.3, 40, t);
      if (s % 8 === 4) noise(0.12, 0.11, 1800, 'bandpass', 0.7, t);
      if (s % 2 === 1) noise(0.03, 0.03, 8000, 'highpass', 1, t);
      if (s % 2 === 0) {
        const f = 110 * Math.pow(2, BASS[(s / 2) % 16] / 12);
        tone(f, 0.14, 'triangle', 0.11, null, t);
        tone(f, 0.1, 'square', 0.018, null, t);
      }
    } catch (e) {}
    mNext += sp; mStep++;
  }
}

/* ---------- layout & input ---------- */
const BTN = {};
let btnTop = 0, uiBtn = {}, hudTop = 0, hudAbove = false;
function readInsets() {
  const cs = getComputedStyle(probe);
  inset = { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function layoutButtons() {
  const u = clamp(Math.min(W, H) * 0.14, 46, 84);
  const pb = inset.b + 14, pl = inset.l + 16, pr = inset.r + 16;
  const by = H - pb - u * 0.62;
  BTN.left = { x: pl + u * 0.62, y: by, r: u * 0.6, move: true };
  BTN.right = { x: pl + u * 2.0, y: by, r: u * 0.6, move: true };
  const A = { x: W - pr - u * 0.7, y: H - pb - u * 0.7 };
  const at = (deg, dist, r, label) => ({ x: A.x + Math.cos(deg * Math.PI / 180) * dist, y: A.y - Math.sin(deg * Math.PI / 180) * dist, r, label });
  const d = u * 1.42, r = u * 0.44;
  BTN.attack = { x: A.x, y: A.y, r: u * 0.66, label: 'SLASH' };
  BTN.jump = at(180, d, r, 'JUMP');
  BTN.dash = at(138, d, r, 'DASH');
  BTN.heavy = at(94, d, r, 'HEAVY');
  BTN.parry = at(160, d * 1.8, r, 'PARRY');
  BTN.special = at(118, d * 1.8, r, 'SURGE');
  btnTop = Math.min(...Object.values(BTN).map(b => b.y - b.r));
}
function resize() {
  readInsets();
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const aspect = W / H;
  VW = Math.round(clamp(VH * aspect, aspect < 1 ? 340 : 400, 600));
  off.width = VW; off.height = VH;
  const s = Math.min(W / VW, H / VH);
  const gw = VW * s, gh = VH * s;
  layoutButtons();
  let gy = (H - gh) / 2;
  if (aspect < 1) gy = Math.max(inset.t + 8, Math.min(gy, (btnTop - 12 - gh) / 2 + inset.t / 2));
  view = { x: (W - gw) / 2, y: gy, w: gw, h: gh, s };
  hudAbove = aspect < 1 && view.y - inset.t > 70;
  hudTop = hudAbove ? view.y - 70 : Math.max(view.y, inset.t) + 12;
  const top = hudTop + 10;
  const right = Math.min(view.x + view.w, W - inset.r) - 26;
  uiBtn.pause = { x: right, y: top, r: 17 };
  uiBtn.mute = { x: right - 42, y: top, r: 17 };
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

const ACTIONS = ['jump', 'attack', 'heavy', 'dash', 'parry', 'special'];
const buf = {}; ACTIONS.forEach(a => buf[a] = 0);
const keyHeld = {}, touchCount = {};
['left', 'right', ...ACTIONS].forEach(k => { keyHeld[k] = false; touchCount[k] = 0; });
function press(name) { if (name in buf) buf[name] = 0.16; }
function isHeld(name) { return keyHeld[name] || touchCount[name] > 0; }
function take(name) { if (buf[name] > 0) { buf[name] = 0; return true; } return false; }

const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
  KeyJ: 'attack', KeyZ: 'attack', KeyK: 'heavy', KeyX: 'heavy',
  ShiftLeft: 'dash', ShiftRight: 'dash', KeyC: 'dash', KeyL: 'parry', KeyV: 'parry',
  KeyU: 'special', KeyQ: 'special',
};
window.addEventListener('keydown', e => {
  ensureAudio();
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); e.preventDefault(); return; }
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (mode !== 'play') {
    if (e.code === 'Enter' || e.code === 'Space' || e.code === 'KeyJ') { tapToStart(); e.preventDefault(); }
    return;
  }
  if (paused) { if (e.code === 'Enter') togglePause(); return; }
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  if (!e.repeat) press(k);
  keyHeld[k] = true;
});
window.addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keyHeld[k] = false; });
window.addEventListener('blur', () => { Object.keys(keyHeld).forEach(k => keyHeld[k] = false); if (mode === 'play') paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'play') paused = true; });

function hitBtn(x, y, onlyMove) {
  let best = null, bd = 1e9;
  for (const [name, b] of Object.entries(BTN)) {
    if (name === 'special' && (!P || P.energy < 100)) continue;
    if (onlyMove && !b.move) continue;
    const d = Math.hypot(x - b.x, y - b.y) / b.r;
    const slop = b.move ? 1.5 : 1.22;
    if (d < slop && d < bd) { bd = d; best = name; }
  }
  return best;
}
const near = (x, y, b) => b && Math.hypot(x - b.x, y - b.y) < b.r + 8;
const ptr = new Map();
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.pointerType === 'touch') showTouch = true;
  ensureAudio();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  const x = e.clientX, y = e.clientY;
  if (near(x, y, uiBtn.mute)) { toggleMute(); return; }
  if (mode === 'play' && near(x, y, uiBtn.pause)) { togglePause(); return; }
  if (mode !== 'play') { tapToStart(); return; }
  if (paused) { paused = false; return; }
  const b = hitBtn(x, y);
  ptr.set(e.pointerId, b);
  if (b) { touchCount[b]++; press(b); }
});
cv.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return;
  const old = ptr.get(e.pointerId);
  if (old && !BTN[old].move) return;
  const b = hitBtn(e.clientX, e.clientY, true);
  if (b && b !== old) {
    if (old) touchCount[old]--;
    touchCount[b]++;
    ptr.set(e.pointerId, b);
  }
});
function release(e) {
  const b = ptr.get(e.pointerId);
  if (b) touchCount[b] = Math.max(0, touchCount[b] - 1);
  ptr.delete(e.pointerId);
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());

function togglePause() { if (mode === 'play') { paused = !paused; sfx('ui'); } }
function toggleMute() {
  muted = !muted; store('muted', muted);
  if (master) master.gain.value = muted ? 0 : 0.55;
}

/* ---------- game data ---------- */
const MV = {
  l0:    { dur: 0.28, a0: 0.06, a1: 0.13, dmg: 7,  kb: 110, reach: 32, lunge: 110, next: 'l1', chain: 0.12, stun: 0.38, from: -1.9, to: 0.9,  hs: 0.045, lean: 0.12 },
  l1:    { dur: 0.28, a0: 0.06, a1: 0.13, dmg: 8,  kb: 120, reach: 32, lunge: 110, next: 'l2', chain: 0.12, stun: 0.38, from: 1.3,  to: -1.3, hs: 0.045, lean: 0.1 },
  l2:    { dur: 0.46, a0: 0.1,  a1: 0.19, dmg: 15, kb: 300, reach: 40, lunge: 200, chain: 0.34, stun: 0.6,  from: -2.7, to: 1.4,  hs: 0.09, sh: 4, launch: -170, lean: 0.3, big: true },
  heavy: { dur: 0.62, a0: 0.3,  a1: 0.38, dmg: 26, kb: 380, reach: 48, lunge: 260, chain: 0.5,  stun: 0.75, from: -2.9, to: 1.35, hs: 0.12, sh: 6, brk: true, lean: 0.35, big: true },
  air:   { dur: 0.3,  a0: 0.05, a1: 0.15, dmg: 9,  kb: 90,  reach: 32, lunge: 0,   next: 'air', chain: 0.2, stun: 0.42, from: -1.6, to: 1.7, hs: 0.05, juggle: -150, lean: 0.15, air: true },
};

const ET = {
  grunt:  { hp: 38,  w: 14, h: 42, s: 1,   speed: 78, score: 300,
    c: { skin: '#c89a7a', hair: '#2a1b14', top: '#5b6475', top2: '#454c5a', pants: '#2b2f3a', boots: '#141418', hat: '#b8323a' }, hat: 'beanie', wpn: { type: 'pipe', len: 20, col: '#8d97a8' } },
  gunner: { hp: 28,  w: 14, h: 42, s: 1,   speed: 70, score: 350,
    c: { skin: '#8c6248', hair: '#111111', top: '#2e3f37', top2: '#22302a', pants: '#1f2228', boots: '#0f0f12', hat: '#1c1c22' }, hat: 'cap', wpn: { type: 'gun', len: 8 } },
  brute:  { hp: 140, w: 20, h: 56, s: 1.3, speed: 46, score: 900, armor: true, heavyBody: true, bulk: 1.45,
    c: { skin: '#b07c5c', hair: '#3b2a20', top: '#6e3b2b', top2: '#55301f', pants: '#2d2a26', boots: '#151311', hat: '#3b2a20' }, hat: 'bald', wpn: { type: 'hammer', len: 24, col: '#6d7480' } },
  boss:   { hp: 720, w: 24, h: 66, s: 1.5, speed: 58, score: 5000, armor: true, heavyBody: true, bulk: 1.55,
    c: { skin: '#c9906b', hair: '#d8d8d8', top: '#4a3b2a', top2: '#3a2e21', pants: '#2a2d33', boots: '#121214', hat: '#f2c230', stripe: '#c9d35a' }, hat: 'hard', wpn: { type: 'wrench', len: 28, col: '#9aa3b2' } },
};

const WAVES = [
  { name: 'SHIFT 1', tag: 'Clock in', spawns: ['grunt', 'grunt', 'grunt'], max: 3 },
  { name: 'SHIFT 2', tag: 'Inventory check', spawns: ['grunt', 'grunt', 'gunner', 'grunt'], max: 3 },
  { name: 'SHIFT 3', tag: 'Loading dock', spawns: ['grunt', 'gunner', 'grunt', 'gunner', 'grunt'], max: 4 },
  { name: 'SHIFT 4', tag: 'Heavy lifting', spawns: ['brute', 'grunt', 'gunner', 'grunt'], max: 4 },
  { name: 'SHIFT 5', tag: 'Peak season', spawns: ['grunt', 'brute', 'gunner', 'grunt', 'gunner', 'brute', 'grunt'], max: 4 },
  { name: 'OVERTIME', tag: 'The Foreman wants a word', spawns: ['boss'], max: 3 },
];

const PLAYER_C = { skin: '#d7a789', hair: '#15151c', top: '#26324a', top2: '#1b2436', pants: '#1e2638', boots: '#0d0f14', hat: '#ff8a1f', stripe: '#ff8a1f', eye: '#f4f0ff' };
const WHITE_C = { skin: '#fff', hair: '#fff', top: '#fff', top2: '#f0f0f0', pants: '#fff', boots: '#fff', hat: '#fff', eye: '#fff' };
const GHOST_C = { skin: '#8a55e8', hair: '#8a55e8', top: '#8a55e8', top2: '#7444cc', pants: '#8a55e8', boots: '#8a55e8', hat: '#8a55e8', eye: '#8a55e8' };

/* ---------- state ---------- */
let mode = 'title', paused = false, modeT = 0, time = 0;
let P = null, enemies = [], shots = [], quakes = [], parts = [], arcs = [], ghosts = [], texts = [];
let cam = { x: ARENA_W / 2 - 240 }, shake = 0, hitstop = 0, slow = 0, flashT = 0, flashCol = '#fff';
let wave = 0, queue = [], spawnT = 0, phase = 'banner', phaseT = 0;
let score = 0, combo = 0, comboT = 0, maxCombo = 0, best = load('best', 0), newBest = false, runTime = 0;
let banner = { t: 0, big: '', small: '', col: '#ff2650' };

function newPlayer() {
  const p = { x: ARENA_W / 2, y: GROUND, vx: 0, vy: 0, face: 1, hp: 100, maxHp: 100, energy: 0, onGround: true,
    state: 'idle', t: 0, move: null, mname: '', hitSet: new Set(), inv: 0, dashCd: 0, airDash: false, jumps: 0, airHits: 0,
    flash: 0, lastStand: false, deadT: 0, scarf: [], lunged: false, arcDone: false, spDone: false, ghostT: 0, w: 14, h: 40, s: 1 };
  for (let i = 0; i < 7; i++) p.scarf.push({ x: p.x - i * 4, y: p.y - 34 });
  return p;
}
P = newPlayer();

function resetRun() {
  P = newPlayer();
  enemies = []; shots = []; quakes = []; parts = []; arcs = []; ghosts = []; texts = [];
  score = 0; combo = 0; comboT = 0; maxCombo = 0; runTime = 0; newBest = false;
  shake = hitstop = slow = flashT = 0;
  ACTIONS.forEach(a => buf[a] = 0);
  cam.x = clamp(P.x - VW / 2, 0, ARENA_W - VW);
  mode = 'play'; paused = false; modeT = 0;
  startWave(location.hash === '#overtime' ? WAVES.length - 1 : 0);
}
function tapToStart() {
  if (mode === 'title' || ((mode === 'over' || mode === 'win') && modeT > 0.9)) { sfx('ui'); resetRun(); }
}
function startWave(i) {
  wave = i; queue = WAVES[i].spawns.slice(); phase = 'banner'; phaseT = 0; spawnT = 0.3;
  setBanner(WAVES[i].name, WAVES[i].tag, i === WAVES.length - 1 ? '#ffb020' : '#ff2650', 2.2);
}
function setBanner(big, small, col, t) { banner = { t: t || 2, max: t || 2, big, small, col: col || '#ff2650' }; }
function endRun(won) {
  mode = won ? 'win' : 'over'; modeT = 0;
  if (score > best) { best = score; newBest = true; store('best', best); }
  sfx(won ? 'clear' : 'lose');
}

/* ---------- effects ---------- */
function sparks(x, y, n, col, spd, dir, spread, life) {
  for (let i = 0; i < n; i++) {
    const a = dir == null ? rand() * TAU : dir + (rand() - 0.5) * (spread || 1.2);
    const v = (spd || 160) * (0.4 + rand() * 0.9);
    const l = (life || 0.3) * (0.6 + rand() * 0.7);
    parts.push({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: l, max: l, col, gr: 400 });
  }
}
function dust(x, y, n, spd) {
  for (let i = 0; i < n; i++) {
    const l = 0.4 + rand() * 0.4;
    parts.push({ k: 'dust', x: x + (rand() - 0.5) * 10, y: y - rand() * 3, vx: (rand() - 0.5) * (spd || 80), vy: -rand() * 30, life: l, max: l, r: 2 + rand() * 3, gr: -20 });
  }
}

function addShake(v) { shake = Math.max(shake, v * (reduceMotion ? 0.3 : 1)); }

function drawFloor(cx) {

  const start = Math.floor((cx - 400) / 90) * 90;
  for (let wx = start; wx < cx + VW + 400; wx += 90) {
    const x0 = VW / 2 + (wx - cx - VW / 2) * f(200), x1 = VW / 2 + (wx - cx - VW / 2) * f(VH);

  for (const zx of [70, ARENA_W - 70]) {

}

/* ---------- world render ---------- */
function drawWorld() {
  const sx = shake > 0 ? (rand() - 0.5) * shake * 2 : 0;

  g.drawImage(rackL, -Math.round(cx * 0.7), 0);
  drawFloor(cx);
  drawDoors(cx);
  drawLamps(cx);

  g.translate(-cx, 0);

    const hgt = Math.max(0, GROUND - y), k = Math.max(0.3, 1 - hgt / 160);
    g.fillStyle = `rgba(0,0,0,${0.38 * k})`;
    g.beginPath(); g.ellipse(Math.round(x), GROUND + 1, w * 0.85 * k, 3 * k, 0, 0, TAU); g.fill();
  };
  for (const e of enemies) shadow(e.x, e.y, e.w);
  if (mode !== 'title' || true) shadow(P.x, P.y, 12);
  for (const e of enemies) if (e.seq && e.seq[e.si] && e.seq[e.si].k === 'leap' && e.leapX != null) {
    g.strokeStyle = `rgba(255,80,60,${0.5 + Math.sin(time * 30) * 0.3})`; g.lineWidth = 1;
    g.beginPath(); g.ellipse(e.leapX, GROUND + 1, 26, 4, 0, 0, TAU); g.stroke();
  }

  for (const q of quakes) {
    g.save(); g.globalCompositeOperation = 'lighter';
    const a = Math.min(1, q.life);
    g.fillStyle = `rgba(255,140,60,${0.55 * a})`;
    g.beginPath(); g.moveTo(q.x - 10 * q.dir, GROUND + 2); g.quadraticCurveTo(q.x, GROUND - 16, q.x + 6 * q.dir, GROUND + 2); g.closePath(); g.fill();
    g.fillStyle = `rgba(255,220,160,${0.7 * a})`; g.fillRect(q.x - 2, GROUND - 6, 4, 8);
    g.restore();
  }

  for (const gh of ghosts) {
    g.globalAlpha = (gh.life / gh.max) * 0.5;
    drawMan(Object.assign({ x: gh.x, y: gh.y, face: gh.face, s: 1, c: GHOST_C, hat: 'band', wpn: null }, gh.pose));
    g.globalAlpha = 1;
  }

  for (const e of enemies) {
    if (e.dead && e.deadT > 0.6 && Math.floor(e.deadT * 20) % 2) continue;
    const pose = enemyPose(e);
    const white = e.hitT > 0;
    let rot = 0;
    if (e.dead) rot = -e.face * Math.min(1.45, e.deadT * 5);
    drawMan(Object.assign({ x: e.x, y: e.y, face: e.face, s: e.s, c: white ? WHITE_C : e.c, hat: e.hat, wpn: e.wpn, bulk: e.bulk, white, rot }, pose));
    if (e.seq && e.seq[e.si] && e.seq[e.si].k === 'aim') {
      const ph = e.seq[e.si], k = e.pt / ph.t;
      const y = e.y - 30, x0 = e.x + e.face * 20;
      g.save(); g.globalCompositeOperation = 'lighter';
      g.strokeStyle = `rgba(255,40,60,${0.25 + k * 0.5 + (k > 0.75 ? Math.sin(time * 60) * 0.25 : 0)})`;
      g.lineWidth = k > 0.75 ? 1.5 : 1;
      g.beginPath(); g.moveTo(x0, y + 0.5); g.lineTo(x0 + e.face * 420, y + 0.5); g.stroke();

  const blink = P.inv > 0 && P.state === 'hurt' && Math.floor(time * 30) % 2;
  if (!blink) {
    const pose = poseOf(P);
    const white = P.flash > 0 && P.state !== 'hurt';
    const rot = P.state === 'dead' ? -P.face * Math.min(1.5, P.deadT * 4) : 0;
    drawMan(Object.assign({ x: P.x, y: P.y, face: P.face, s: 1, c: P.flash > 0 ? WHITE_C : PLAYER_C, hat: 'band',

  for (const s of shots) {

    g.lineWidth = 2;
    g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x - sign(s.vx) * 10, s.y); g.stroke();
    g.fillStyle = '#fff'; g.fillRect(s.x - 1, s.y - 1, 2, 2);
  }
  for (const p of parts) {
    if (p.k !== 'spark') continue;

  }

  const vg = g.createRadialGradient(VW / 2, VH * 0.55, VH * 0.3, VW / 2, VH * 0.55, VW * 0.75);

/* ---------- HUD ---------- */
function slantBar(x, y, w, h, frac, col, bg) {

  path(w); ctx.fillStyle = bg; ctx.fill();
  if (frac > 0) { path(Math.max(0, w * frac)); ctx.fillStyle = col; ctx.fill(); }
  path(w); ctx.strokeStyle = 'rgba(233,238,247,0.35)'; ctx.lineWidth = 1; ctx.stroke();
}
function txt(s, x, y, size, col, align, font, weight) {

  ctx.fillStyle = col; ctx.textAlign = align || 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}

    const bbw = Math.min(view.w * 0.5, 320), bx = narrow ? view.x + view.w - bbw - 16 : cxm - bbw / 2, by = narrow ? top + 46 : top + 38;
    txt('THE FOREMAN', bx, by - 3, 10, '#ffb020');
    slantBar(bx, by, bbw, 8, Math.max(0, boss.hp / boss.maxHp), '#ffb020', 'rgba(8,10,16,0.8)');
  }

  if (combo >= 2 && comboT > 0) {
    const a = Math.min(1, comboT * 1.5);
    const rank = combo >= 35 ? ['S', '#ffe27a'] : combo >= 20 ? ['A', '#ff7a95'] : combo >= 10 ? ['B', '#c99bff'] : combo >= 5 ? ['C', '#7cd4ff'] : ['D', '#a9b3c6'];
    const x = Math.min(view.x + view.w, W - inset.r) - 18, y = view.y + view.h * 0.36;
    ctx.globalAlpha = a;
    txt(rank[0], x, y + 4, 40, rank[1], 'right', FONT_D, 400);
    txt(String(combo), x - 36, y, 26, '#e9eef7', 'right', FONT_D, 400);
    txt('HIT COMBO', x - 36, y + 13, 9, '#a9b3c6', 'right');
    ctx.globalAlpha = 1;
  }

  for (const t of texts) {
    const p = worldToScreen(t.x, t.y);
    ctx.globalAlpha = Math.min(1, t.life / t.max * 2);
    ctx.font = `700 ${Math.round(t.size * view.s * 0.55)}px ${FONT_H}`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.strokeText(t.txt, p.x, p.y);
    ctx.fillStyle = t.col; ctx.fillText(t.txt, p.x, p.y);
  }
  ctx.globalAlpha = 1;

  if (!showTouch && wave === 0 && runTime < 14) {
    txt('A/D move · Space jump (twice) · J slash · K heavy · L parry · Shift dash · U surge · P pause', view.x + view.w / 2, view.y + view.h - 10, 11, 'rgba(233,238,247,0.75)', 'center', FONT_H, 500);
  }
}
function drawBanner() {
  if (banner.t <= 0) return;
  const k = banner.t / banner.max;
  const intro = Math.min(1, (banner.max - banner.t) * 6);
  const a = Math.min(1, banner.t * 3) * intro;
  const cx = view.x + view.w / 2, cy = view.y + view.h * 0.42;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(5,7,11,0.6)';
  const bh = view.h * 0.2;
  ctx.fillRect(view.x, cy - bh * 0.62, view.w * intro, bh);
  ctx.translate(cx + (1 - intro) * 60, cy);
  ctx.transform(1, 0, -0.12, 1, 0, 0);
  const size = Math.round(clamp(view.h * 0.15, 26, 72));
  ctx.font = `400 ${size}px ${FONT_D}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(80,220,255,0.55)'; ctx.fillText(banner.big, -2, 0);
  ctx.fillStyle = banner.col; ctx.fillText(banner.big, 1.5, 0);
  ctx.font = `700 ${Math.round(size * 0.3)}px ${FONT_H}`;
  ctx.fillStyle = '#e9eef7'; ctx.fillText(banner.small.toUpperCase(), 0, size * 0.42);
  ctx.restore();
  void k;
}
function drawButtons() {
  if (!showTouch || mode !== 'play') return;
  ctx.save();
  for (const [name, b] of Object.entries(BTN)) {
    const ready = name === 'special' ? P.energy >= 100 : true;
    if (name === 'special' && !ready) continue;
    const down = touchCount[name] > 0;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU);
    let fill = down ? 'rgba(233,238,247,0.32)' : 'rgba(10,14,22,0.42)';
    if (name === 'attack') fill = down ? 'rgba(180,92,255,0.6)' : 'rgba(110,50,170,0.42)';
    if (name === 'special') fill = `rgba(180,92,255,${0.45 + Math.sin(time * 8) * 0.2})`;
    if (name === 'parry') fill = down ? 'rgba(255,255,255,0.4)' : 'rgba(30,40,58,0.5)';
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = name === 'attack' ? 2.5 : 1.5;
    ctx.strokeStyle = name === 'attack' || name === 'special' ? 'rgba(217,179,255,0.85)' : 'rgba(233,238,247,0.5)';
    ctx.stroke();
    if (b.move) {
      const d = name === 'left' ? -1 : 1, s = b.r * 0.38;
      ctx.fillStyle = down ? '#fff' : 'rgba(233,238,247,0.85)';
      ctx.beginPath(); ctx.moveTo(b.x + d * s, b.y); ctx.lineTo(b.x - d * s * 0.7, b.y - s); ctx.lineTo(b.x - d * s * 0.7, b.y + s); ctx.closePath(); ctx.fill();
    } else {
      ctx.font = `700 ${Math.round(b.r * (name === 'attack' ? 0.36 : 0.4))}px ${FONT_H}`;
      ctx.fillStyle = '#e9eef7'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.label, b.x, b.y + 1);
    }
  }
  ctx.restore();
}
function drawUIButtons() {
  const m = uiBtn.mute, p = uiBtn.pause;
  ctx.save();
  ctx.lineWidth = 1.5;
  for (const b of mode === 'play' ? [m, p] : [m]) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fillStyle = 'rgba(10,14,22,0.55)'; ctx.fill();
    ctx.strokeStyle = 'rgba(233,238,247,0.4)'; ctx.stroke();
  }
  ctx.fillStyle = '#e9eef7';
  if (mode === 'play') { ctx.fillRect(p.x - 5, p.y - 6, 3.5, 12); ctx.fillRect(p.x + 1.5, p.y - 6, 3.5, 12); }
  ctx.beginPath(); ctx.moveTo(m.x - 7, m.y - 3); ctx.lineTo(m.x - 3, m.y - 3); ctx.lineTo(m.x + 2, m.y - 7); ctx.lineTo(m.x + 2, m.y + 7); ctx.lineTo(m.x - 3, m.y + 3); ctx.lineTo(m.x - 7, m.y + 3); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#e9eef7';
  if (muted) { ctx.beginPath(); ctx.moveTo(m.x + 4, m.y - 4); ctx.lineTo(m.x + 9, m.y + 4); ctx.moveTo(m.x + 9, m.y - 4); ctx.lineTo(m.x + 4, m.y + 4); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(m.x + 3, m.y, 5, -0.8, 0.8); ctx.stroke(); }
  ctx.restore();
}
function titleText(lines, cy, size) {
  const cx = view.x + view.w / 2;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.transform(1, 0, -0.14, 1, 0, 0);
  ctx.font = `400 ${size}px ${FONT_D}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  lines.forEach((l, i) => {
    const y = i * size * 0.98;
    const jit = Math.floor(time * 12) % 23 === 0 ? 3 : 0;
    ctx.fillStyle = 'rgba(80,220,255,0.5)'; ctx.fillText(l, -2.5 - jit, y);
    ctx.fillStyle = '#ff2650'; ctx.fillText(l, 1.5 + jit, y);
  });
  ctx.restore();
}
function drawOverlay() {
  const cx = view.x + view.w / 2;
  if (mode === 'title') {
    ctx.fillStyle = 'rgba(5,7,11,0.55)'; ctx.fillRect(view.x, view.y, view.w, view.h);
    const size = Math.round(clamp(view.h * 0.2, 34, 110));
    titleText(['WAREHOUSE', 'SHOWDOWN'], view.y + view.h * 0.3, size);
    txt('ONE NIGHT SHIFT · SIX WAVES · ONE CHARGED BOX CUTTER', cx, view.y + view.h * 0.3 + size * 1.5, clamp(view.h * 0.035, 10, 16), '#a9b3c6', 'center');
    if (Math.floor(time * 2) % 2 === 0 || reduceMotion) txt(showTouch ? 'TAP TO CLOCK IN' : 'PRESS ENTER TO CLOCK IN', cx, view.y + view.h * 0.78, clamp(view.h * 0.06, 14, 26), '#e9eef7', 'center');
    if (best > 0) txt('BEST ' + best, cx, view.y + view.h * 0.86, 12, '#ffb020', 'center');
    const hint = showTouch ? 'SLASH ×3 for a combo · PARRY right before a hit lands · JUMP twice to double jump' : 'J slash · K heavy · L parry · Shift dash · Space jump · U surge';
    txt(hint, cx, view.y + view.h * 0.94, clamp(view.h * 0.03, 9, 13), 'rgba(233,238,247,0.7)', 'center', FONT_H, 500);
  } else if (mode === 'over' || mode === 'win') {
    const a = Math.min(1, modeT * 2);
    ctx.fillStyle = `rgba(5,7,11,${0.7 * a})`; ctx.fillRect(view.x, view.y, view.w, view.h);
    ctx.globalAlpha = a;
    const size = Math.round(clamp(view.h * 0.17, 30, 90));
    titleText([mode === 'win' ? 'SHIFT COMPLETE' : 'YOU’RE FIRED'], view.y + view.h * 0.32, size);
    const sub = mode === 'win' ? 'The Foreman is down. The warehouse is yours.' : 'You made it to ' + WAVES[wave].name.toLowerCase().replace(/^\w/, c => c.toUpperCase()) + '.';
    txt(sub, cx, view.y + view.h * 0.32 + size * 0.7, clamp(view.h * 0.04, 11, 18), '#e9eef7', 'center', FONT_H, 500);
    const m = Math.floor(runTime / 60), s = Math.floor(runTime % 60);
    const stats = `SCORE ${score}   ·   BEST COMBO ${maxCombo}   ·   TIME ${m}:${String(s).padStart(2, '0')}`;
    txt(stats, cx, view.y + view.h * 0.6, clamp(view.h * 0.04, 11, 18), '#ffb020', 'center');
    if (newBest) txt('NEW BEST', cx, view.y + view.h * 0.68, 12, '#7cf0b0', 'center');
    if (modeT > 0.9 && (Math.floor(time * 2) % 2 === 0 || reduceMotion)) txt(showTouch ? 'TAP TO CLOCK IN AGAIN' : 'PRESS ENTER TO CLOCK IN AGAIN', cx, view.y + view.h * 0.82, clamp(view.h * 0.05, 13, 22), '#e9eef7', 'center');
    ctx.globalAlpha = 1;
  }
  if (paused && mode === 'play') {
    ctx.fillStyle = 'rgba(5,7,11,0.7)'; ctx.fillRect(0, 0, W, H);
    titleText(['ON BREAK'], view.y + view.h * 0.45, Math.round(clamp(view.h * 0.16, 30, 80)));
    txt(showTouch ? 'Tap anywhere to get back to work' : 'Press P to get back to work', cx, view.y + view.h * 0.58, 14, '#e9eef7', 'center', FONT_H, 500);
  }
}
function render() {
  drawWorld();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#07090e'; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(off, view.x, view.y, view.w, view.h);
  if (view.y > 4) {
    for (let x = 0; x < W; x += 16) { ctx.fillStyle = (x / 16) % 2 ? '#d9a514' : '#111'; ctx.fillRect(x, view.y + view.h, 16, 4); ctx.fillRect(x, view.y - 4, 16, 4); }
  }
  if (mode === 'play') { drawHUD(); drawBanner(); }
  drawOverlay();
  drawButtons();
  drawUIButtons();
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) {
    acc += real;
    let n = 0;
    while (acc >= STEP && n < 6) { tick(STEP); acc -= STEP; n++; }
    if (n === 6) acc = 0;
  } else time += real;
  render();
  music();
}
resize();
cam.x = clamp(P.x - VW / 2, 0, ARENA_W - VW);
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) {
  Promise.all([document.fonts.load(`48px ${FONT_D}`), document.fonts.load(`700 12px ${FONT_H}`)]).then(buildBG).catch(() => {});
}
window.__whs = { get state() { return { mode, wave, phase, score, hp: P.hp, enemies: enemies.length, combo }; } };
})();
</script>
