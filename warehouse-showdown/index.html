<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Clocked In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: landscape-first full-screen 3D stage; HUD on top; touch controls in the corners; dialog, defeat, pause and chapter-end as overlays. */
:root{
  --night:#07090e; --panel:rgba(9,12,20,.92); --line:rgba(233,238,247,.16);
  --ink:#e9eef7; --mute:#9aa4b8; --alarm:#ff2650; --vest:#ff8a1f; --gold:#ffc23a; --glow:#c070ff; --stam:#9fd65a;
  --display:'Anton', Impact, 'Arial Narrow Bold', sans-serif;
  --hud:'Chakra Petch', 'Trebuchet MS', system-ui, sans-serif;
  --term:'VT323', 'Courier New', monospace;
  --u:clamp(46px, 13.5vmin, 84px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;color:var(--ink);font-family:var(--hud)}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--night)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
@media (orientation:portrait){#stage{bottom:auto;top:env(safe-area-inset-top,0px);height:min(58vh,125vw);border-bottom:2px solid rgba(255,138,31,.5)}}
#rotate{position:fixed;left:0;right:0;top:calc(min(58vh,125vw) + 8px);text-align:center;font-size:12px;color:var(--mute);letter-spacing:.08em;pointer-events:none}
@media (orientation:landscape){#rotate{display:none}}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#fade.on{opacity:1}
#hud{position:absolute;inset:0;pointer-events:none;padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
@media (orientation:portrait){#hud{padding-top:10px}}
.hud-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hud-l{display:grid;gap:4px;width:min(34vw,240px);flex:none}
.who{font-size:12px;font-weight:700;letter-spacing:.1em}
.bar{position:relative;height:10px;background:rgba(6,8,14,.75);border:1px solid rgba(233,238,247,.28);overflow:hidden}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .12s linear}
.bar b{position:absolute;inset:0;transform-origin:left;background:rgba(255,255,255,.55);transition:transform .6s ease-in .25s}
#hpBar i{background:#d8263e}
#stBar{height:7px;width:82%}#stBar i{background:var(--stam)}
#hpBar.low i{animation:pulse .35s steps(2) infinite}
@keyframes pulse{50%{filter:brightness(1.7)}}
.hud-c{flex:1;min-width:0;text-align:center}
#obj{display:inline-block;font-size:clamp(11px,2.2vmin,14px);font-weight:700;letter-spacing:.08em;background:rgba(5,7,11,.66);border:1px solid rgba(255,138,31,.55);padding:5px 10px;max-width:100%}
#obj span{color:var(--vest);margin-right:6px}
#deliv{margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--gold)}
.ic{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:1px solid rgba(233,238,247,.4);background:rgba(10,14,22,.6);display:grid;place-items:center;cursor:pointer;padding:0}
.ic svg{width:16px;height:16px;fill:var(--ink)}
#bossBar{position:absolute;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(44vw,480px)}
@media (orientation:portrait){#bossBar{bottom:10px;width:88%}}
#bossBar .nm{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--display);font-size:clamp(14px,2.6vmin,20px);letter-spacing:.04em;text-shadow:0 1px 3px #000}
#bossBar .nm small{font-family:var(--hud);font-size:11px;color:var(--gold);letter-spacing:.1em;font-weight:700}
#bossBar .bar{height:9px}#bossBar #bHp i{background:#b81e34}
#bossBar #bPost{height:5px;margin-top:3px}#bossBar #bPost i{background:var(--gold)}
#bPost.full i{animation:pulse .3s steps(2) infinite}
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pips b{width:10px;height:10px;border:1px solid var(--gold);background:transparent;transform:skewX(-15deg)}
.pips b.on{background:var(--gold)}
#area{position:absolute;left:0;right:0;top:28%;text-align:center;pointer-events:none;opacity:0;transition:opacity .8s}
#area.show{opacity:1}
#area div{font-family:var(--display);font-size:clamp(24px,6vmin,50px);letter-spacing:.06em;text-shadow:0 2px 8px #000}
#area small{display:block;font-size:12px;letter-spacing:.2em;color:var(--vest);font-weight:700}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#banner.show{opacity:1}
#banner::before{content:"";position:absolute;inset:-18px 0;background:linear-gradient(90deg,transparent,rgba(5,7,11,.78) 20%,rgba(5,7,11,.78) 80%,transparent);z-index:-1}
#banner .big{font-family:var(--display);font-size:clamp(32px,9vmin,78px);color:var(--vest);line-height:1;transform:skewX(-8deg);text-shadow:-3px 0 rgba(192,112,255,.55)}
#banner .small{font-size:clamp(11px,2.4vmin,16px);font-weight:700;letter-spacing:.14em;margin-top:8px;text-transform:uppercase}
#toast{position:absolute;left:50%;top:17%;transform:translateX(-50%);background:var(--panel);border:1px solid rgba(255,194,58,.55);padding:7px 14px;font-size:12px;font-weight:700;letter-spacing:.1em;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#toast b{color:var(--gold);margin-right:6px}
#pa{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--term);font-size:clamp(20px,4.4vmin,34px);color:#ff5a5a;letter-spacing:.06em;text-align:center;text-shadow:0 0 10px rgba(255,40,40,.7);opacity:0;transition:opacity .3s;pointer-events:none;width:min(92%,760px)}
#pa.show{opacity:1;animation:flick 2.4s steps(1) infinite}
@keyframes flick{0%,92%{opacity:1}94%{opacity:.4}96%{opacity:1}}
#prompt{position:absolute;left:50%;bottom:calc(44px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:13px;font-weight:700;letter-spacing:.08em;background:rgba(5,7,11,.72);padding:6px 12px;border:1px solid var(--line);white-space:nowrap}
#prompt kbd{color:var(--gold);font-family:inherit;margin-right:6px}
@media (orientation:portrait){#prompt{bottom:auto;top:66%}}
#nums,#barks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#nums span{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:14px;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.7),0 0 6px rgba(0,0,0,.6)}
#barks span{position:absolute;transform:translate(-50%,-100%);background:rgba(240,240,236,.94);color:#141018;font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;max-width:60vw;overflow:hidden;text-overflow:ellipsis}
#barks span::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:rgba(240,240,236,.94);border-bottom:0}
#barks span.shout{background:#ffde4a}
#barks span.evil{background:#2a1438;color:#e8c8ff;border:1px solid var(--glow)}
#controls{position:fixed;inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:46%;height:62%;pointer-events:auto;touch-action:none}
@media (orientation:portrait){#stickZone{height:40%}}
#stickBase{position:absolute;left:calc(16px + var(--u)*1.2);bottom:calc(var(--u)*.4);width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);margin:calc(var(--u)*-.85) 0 0 calc(var(--u)*-.85);border-radius:50%;border:1.5px solid rgba(233,238,247,.35);background:rgba(10,14,22,.35)}
#stickKnob{position:absolute;left:50%;top:50%;width:calc(var(--u)*.72);height:calc(var(--u)*.72);margin:calc(var(--u)*-.36) 0 0 calc(var(--u)*-.36);border-radius:50%;background:rgba(233,238,247,.35);border:1.5px solid rgba(233,238,247,.6)}
.b{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:1.5px solid rgba(233,238,247,.5);background:rgba(10,14,22,.45);font-weight:700;letter-spacing:.04em;display:grid;place-items:center;padding:0;cursor:pointer;line-height:1.05;text-align:center}
.b.on{background:rgba(233,238,247,.32)}
.b.big{border-width:2.5px;border-color:rgba(255,138,31,.85);background:rgba(140,60,10,.4)}
.b.big.on{background:rgba(255,138,31,.55)}
.b.act{border-color:var(--gold);background:rgba(255,194,58,.3)}
.b.warn{border-color:#ff5a5a;background:rgba(255,40,40,.3)}
.b.dim{opacity:.38}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding-block:max(16px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at 50% 40%,rgba(7,9,14,.55),rgba(7,9,14,.93));overflow:auto;touch-action:pan-y}
.wrap{width:min(100%,720px);display:grid;gap:14px;margin:auto}
.logo{font-family:var(--display);font-weight:400;color:var(--vest);font-size:clamp(46px,12vmin,120px);line-height:.9;transform:skewX(-10deg);text-shadow:-4px 0 rgba(192,112,255,.6);margin:0}
.chap{font-family:var(--term);font-size:clamp(20px,4vmin,30px);color:var(--ink);letter-spacing:.08em;margin:0}
.keys{font-size:12px;color:var(--mute);line-height:1.5;max-width:70ch;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.go{font-family:var(--display);font-size:22px;letter-spacing:.04em;background:var(--vest);border:0;padding:10px 26px;cursor:pointer;color:#120a04;transform:skewX(-10deg)}
.ghost{font-size:13px;font-weight:700;letter-spacing:.08em;background:transparent;border:1.5px solid var(--line);padding:9px 16px;cursor:pointer}
.tag{font-size:12px;color:var(--mute);letter-spacing:.12em;font-weight:700;margin:0}
#dialog{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(92vw,720px);background:var(--panel);border:1px solid rgba(255,138,31,.55);padding:12px 18px 10px;cursor:pointer}
@media (orientation:portrait){#dialog{bottom:auto;top:calc(min(58vh,125vw) - 10px)}}
#dialog .who{font-family:var(--display);color:var(--vest);font-size:18px;letter-spacing:.04em}
#dialog .say{font-size:15px;line-height:1.45;margin-top:2px;min-height:2.9em}
#dialog .more{font-size:11px;color:var(--mute);text-align:right;letter-spacing:.1em}
.paper{background:#ecebe4;color:#1e1e22;padding:20px 22px;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.6);font-family:var(--term);font-size:20px;line-height:1.25;transform:rotate(-.6deg)}
.paper h3{margin:0 0 8px;font-size:26px;letter-spacing:.06em}
.paper p{margin:0 0 12px;white-space:pre-line}
.paper button{background:#1e1e22;color:#ecebe4;border:0;padding:8px 14px;font-weight:700;letter-spacing:.08em;cursor:pointer;font-family:var(--hud);font-size:13px}
#defeat .big{font-family:var(--display);font-size:clamp(50px,13vmin,120px);color:#d8263e;letter-spacing:.04em;text-align:center;transform:skewX(-8deg)}
#defeat{background:radial-gradient(ellipse at 50% 50%,rgba(30,0,6,.5),rgba(0,0,0,.92))}
#end{background:#000}
#end .t1{font-family:var(--display);font-size:clamp(40px,10vmin,96px);color:var(--vest);letter-spacing:.04em;margin:0;text-align:center}
#end .t2{font-family:var(--term);font-size:clamp(26px,5vmin,42px);margin:0;text-align:center;letter-spacing:.1em}
#end .t3{font-size:clamp(12px,2.4vmin,16px);color:var(--glow);font-weight:700;letter-spacing:.24em;margin:0;text-align:center}
#end .wrap>*{opacity:0;transition:opacity 1.2s}
#end .wrap>.in{opacity:1}
.menu{background:var(--panel);border:1px solid rgba(255,138,31,.45);padding:18px;width:min(100%,520px);display:grid;gap:12px}
.menu h2{font-family:var(--display);font-size:30px;margin:0;color:var(--vest);letter-spacing:.04em;font-weight:400}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:28px;color:var(--vest);background:var(--night)}
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="nums"></div>
  <div id="barks"></div>
  <div id="hud" hidden>
    <div class="hud-row">
      <div class="hud-l">
        <div class="who">TEEJAY</div>
        <div class="bar" id="hpBar"><b id="hpLag"></b><i id="hpFill"></i></div>
        <div class="bar" id="stBar"><i id="stFill"></i></div>
      </div>
      <div class="hud-c"><div id="obj" hidden></div><div id="deliv" hidden></div></div>
      <button class="ic" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg></button>
    </div>
    <div id="bossBar" hidden>
      <div class="nm"><span>JOSE &mdash; THE FLOOR ENFORCER</span><small>RAMS <span class="pips" id="pips"></span></small></div>
      <div class="bar" id="bHp"><b id="bLag"></b><i id="bFill"></i></div>
      <div class="bar" id="bPost"><i id="pFill"></i></div>
    </div>
    <div id="prompt" hidden></div>
  </div>
  <div id="area"><small id="areaSub"></small><div id="areaName"></div></div>
  <div id="banner"><div class="big" id="bBig"></div><div class="small" id="bSmall"></div></div>
  <div id="pa"></div>
  <div id="toast"></div>
</div>
<div id="rotate">Turn your phone sideways for the full view</div>

<div id="controls" hidden>
  <div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
  <button class="b big" data-b="attack">ATTACK</button>
  <button class="b" data-b="dodge">DODGE</button>
  <button class="b act" data-b="interact" hidden>USE</button>
  <button class="b warn" data-b="reset" hidden>RESET</button>
</div>

<div id="title" class="screen">
  <div class="wrap">
    <div><h1 class="logo">CLOCKED<br>IN</h1><p class="chap">CHAPTER 1: YOU&rsquo;RE LATE</p></div>
    <p class="keys">TeeJay is late for work again. Today, something at the warehouse is very wrong.</p>
    <div class="row"><button class="go" id="contBtn" hidden>CONTINUE</button><button class="go" id="newBtn">NEW GAME</button></div>
    <p class="tag" id="saveInfo"></p>
    <p class="keys" id="keysHelp"></p>
  </div>
</div>
<div id="dialog" hidden><div class="who" id="dWho"></div><div class="say" id="dSay"></div><div class="more" id="dMore"></div></div>
<div id="note" class="screen" hidden><div class="paper"><h3 id="noteTitle"></h3><p id="noteText"></p><button id="noteClose">PUT IT DOWN</button></div></div>
<div id="defeat" class="screen" hidden><div class="wrap" style="text-align:center;justify-items:center"><div class="big">WRITTEN UP</div><p class="keys" id="defeatSub"></p><div class="row" style="justify-content:center"><button class="go" id="retryBtn">RETRY</button><button class="ghost" id="defQuit">QUIT TO TITLE</button></div></div></div>
<div id="pause" class="screen" hidden>
  <div class="menu">
    <h2>PAUSED</h2>
    <p class="keys" id="pauseKeys"></p>
    <div class="row">
      <button class="go" id="resumeBtn">RESUME</button>
      <button class="ghost" id="muteBtn">SOUND: ON</button>
      <button class="ghost" id="cpBtn">RESTART CHECKPOINT</button>
      <button class="ghost" id="flBtn" hidden>RESET FORKLIFT</button>
      <button class="ghost" id="quitBtn">QUIT TO TITLE</button>
    </div>
  </div>
</div>
<div id="end" class="screen" hidden>
  <div class="wrap" style="justify-items:center;text-align:center">
    <p class="t1">CHAPTER 1 COMPLETE</p>
    <p class="t2">TO BE CONTINUED</p>
    <p class="t3">NEXT: MANDATORY OVERTIME</p>
    <p class="keys" id="endStats"></p>
    <button class="go" id="endBtn">BACK TO TITLE</button>
  </div>
</div>
<div id="fade"></div>
<div id="loading">CLOCKING IN&hellip;</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (!window.THREE) { $('loading').textContent = 'Could not load the 3D engine. Check your connection and reload.'; return; }

/* ================= utilities ================= */
const TAU = Math.PI * 2, rand = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const sign = v => v < 0 ? -1 : 1;
const pick = a => a[Math.floor(rand() * a.length)];
function store(k, v) { try { localStorage.setItem('ci1_' + k, JSON.stringify(v)); } catch (e) {} }
function load(k, d) { try { const v = localStorage.getItem('ci1_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let touchUI = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
const fmt = n => Math.round(n).toLocaleString('en-US');

/* ================= audio ================= */
let ac = null, master = null, noiseBuf = null, muted = !!load('muted', false);
function ensureAudio() {
  if (!ac) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try {
      ac = new C(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.55; master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { ac = null; return; }
  }
  if (ac.state === 'suspended') ac.resume().catch(() => {});
}
function tone(f, dur, type, vol, f2, when) {
  const t = ac.currentTime + (when || 0), o = ac.createOscillator(), gn = ac.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  gn.gain.setValueAtTime(0.0001, t); gn.gain.linearRampToValueAtTime(vol, t + Math.min(0.01, dur / 4)); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, freq, type, q, when, f2) {
  const t = ac.currentTime + (when || 0), s = ac.createBufferSource(); s.buffer = noiseBuf;
  const fl = ac.createBiquadFilter(); fl.type = type || 'bandpass'; fl.frequency.setValueAtTime(freq, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  fl.Q.value = q || 1;
  const gn = ac.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(gn); gn.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
}
const SFX = {
  swing: h => noise(h ? 0.2 : 0.1, h ? 0.24 : 0.14, h ? 1500 : 2600, 'bandpass', 0.8, 0, h ? 450 : 900),
  punch: () => noise(0.07, 0.12, 1200, 'bandpass', 0.6, 0, 500),
  hit: h => { tone(h ? 110 : 170, 0.12, 'square', 0.15, 40); noise(0.09, h ? 0.4 : 0.26, h ? 900 : 1700, 'lowpass', 0.7); },
  crit: () => { tone(90, 0.4, 'square', 0.2, 30); noise(0.3, 0.4, 600, 'lowpass'); tone(1200, 0.3, 'triangle', 0.1, 600); },
  parry: () => { tone(1650, 0.4, 'triangle', 0.2, 1500); tone(2480, 0.28, 'sine', 0.1); noise(0.05, 0.22, 5000, 'highpass'); },
  guard: () => tone(900, 0.05, 'triangle', 0.05),
  hurt: () => { tone(220, 0.22, 'sawtooth', 0.15, 70); noise(0.12, 0.22, 700, 'lowpass'); },
  shoot: () => { noise(0.1, 0.28, 3000, 'highpass'); tone(600, 0.08, 'square', 0.08, 150); },
  roll: () => noise(0.25, 0.12, 700, 'bandpass', 0.6, 0, 250),
  throw: () => noise(0.22, 0.18, 900, 'bandpass', 0.7, 0, 3000),
  pickup: () => { tone(520, 0.07, 'square', 0.07); tone(780, 0.1, 'square', 0.07, null, 0.06); },
  drink: () => { noise(0.3, 0.08, 500, 'lowpass'); tone(330, 0.3, 'sine', 0.08, 500, 0.15); },
  heal: () => [523, 659, 784].forEach((f, i) => tone(f, 0.4, 'sine', 0.06, null, i * 0.07)),

  const canUse = P.riding || (nearAct && (!nearAct.label().includes('first'))) || (P.carry && !cine);
  if (label && P.state !== 'dead' && !cine) { pr.hidden = false; pr.innerHTML = touchUI ? label : `<kbd>E</kbd>${label}`; BTNS.interact.hidden = !touchUI; const bl = P.riding ? 'EXIT' : P.carry && !nearAct ? 'DROP' : 'USE'; if (hudCache.ib !== bl) { BTNS.interact.textContent = bl; hudCache.ib = bl; } BTNS.interact.classList.toggle('dim', !canUse); }
  else { pr.hidden = true; BTNS.interact.hidden = true; }
  BTNS.attack.classList.toggle('dim', !!P.carry);
  BTNS.dodge.classList.toggle('dim', !!P.carry);
}

/* ================= loop ================= */
function tick(dt) {
  time += dt;
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').classList.remove('show'); }
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.remove('show'); }
  if (areaT > 0) { areaT -= dt; if (areaT <= 0) $('area').classList.remove('show'); }
  if (paT > 0) { paT -= dt; if (paT <= 0) $('pa').classList.remove('show'); }
  updateDialog(dt);
  shake = Math.max(0, shake - dt * 1.8); flashA = Math.max(0, flashA - dt * 2.5);
  if (mode === 'play' && S && !ui) S.time += dt;
  if (hitstop > 0) { hitstop -= dt; return; }
  const live = mode === 'play' && !ui && !transitioning;
  if (live) for (const a of ACTIONS) buf[a] = Math.max(0, buf[a] - dt);
  let ts = 1; if (slow > 0) { slow -= dt; ts = 0.35; }
  const d = dt * ts;
  if (live) {
    updateWaits(d);
    updatePlayer(d); updateCarried(); updateCompanion(d); updateNpcs(d); updateEnemies(d); updateJose(d); updateShots(d); updateQuakes(d);
    outbreakCheck();
  } else if (mode === 'play' && ui === 'defeat') { updatePlayer(d); updateEnemies(d); }
  updateFalling(d); updateSparks(d); updatePools(d); updateNums(d); updateBarks(dt); updateEnv(d);
}
let last = performance.now(), acc = 0;
const STEP = 1 / 60;
function frame(now) {
  requestAnimationFrame(frame);
  const real = Math.min(0.1, (now - last) / 1000); last = now;
  if (!paused) { acc += real; let n = 0; while (acc >= STEP && n < 5) { tick(STEP); acc -= STEP; n++; } if (n === 5) acc = 0; }
  if (P && mode === 'play') animatePlayer(real);
  if (companion) animateSimple(companion);
  for (const e of enemies) animateHostile(e);
  animateJose();
  updateCamera(real);
  compMat.uniforms.time.value = time;
  compMat.uniforms.lowHp.value = (P && mode === 'play' && P.hp / P.maxHp < 0.25) || alarm ? 1 : 0;
  compMat.uniforms.sat.value = ui === 'defeat' ? 0.15 : 1;
  compMat.uniforms.flash.value.set(flashCol.r, flashCol.g, flashCol.b, Math.min(0.7, flashA));
  renderFrame();
  if (mode === 'play') updateHud(real);
  music();
}

/* ================= boot ================= */
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
toTitle();
$('loading').remove();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in TEXT_TEX) delete TEXT_TEX[k]; });
window.__ci = {
  get state() { return { mode, ui, cine, room: ROOM && ROOM.id, step: S && S.step, delivered: S && S.delivered, cp: S && S.cp.id, hp: P ? Math.round(P.hp) : null, st: P ? Math.round(P.st) : null, carry: !!(P && P.carry), riding: !!(P && P.riding), near: nearAct ? nearAct.label() : null, x: P ? +P.x.toFixed(2) : null, z: P ? +P.z.toFixed(2) : null, enemies: enemies.filter(e => !e.defeated).length, jose: J ? { state: J.state, hp: Math.round(J.hp), posture: Math.round(J.posture), rams: J.rams, p2: J.p2, x: +J.a.x.toFixed(1), z: +J.a.z.toFixed(1) } : null, fl: FL ? { x: +FL.x.toFixed(1), z: +FL.z.toFixed(1), speed: +FL.speed.toFixed(1) } : null }; },
  newGame() { $('newBtn').click(); },
  advance() { if (ui === 'dialog') { advanceDialog(); return true; } return false; },
  tp(x, z) { if (P) { P.x = x; P.z = z; } },
  god() { P.maxHp = 9999; P.hp = 9999; },
  hurt(n) { P.inv = 0; damagePlayer(n, 1, false); },
  boxes() { return boxes.map(b => ({ x: +b.x.toFixed(1), z: +b.z.toFixed(1), placed: b.placed, held: b.held })); },
  enemyPos() { const e = enemies.find(o => !o.defeated); return e ? { x: e.x, z: e.z } : null; },
  breakPosture() { if (J && inCombat()) { J.posture = J.pMax; postureBreak(); } },
  jose() { return J; }, fl() { return FL; },
  skipTo(cpId) { const map = { clockin: ['breakroom', 5, 0, 6, -2.5], tiles: ['floor', 7, 4, 30, 0.5], outbreak: ['floor', 8, 4, 22, 0], arena: ['bay', 9, 0, 12, -1] }; const m = map[cpId]; S.cp = { id: cpId, room: m[0], step: m[1], delivered: m[2], x: m[3], z: m[4] }; loadCheckpoint(); },
};
})();
</script>
